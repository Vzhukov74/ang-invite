<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Наша встреча уже сегодня! ✨</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffe3e8 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary: #ff4d6d;
            --text-main: #2b2d42;
            --text-muted: #8d99ae;
            --disabled-bg: #e9ecef;
            --disabled-text: #adb5bd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 26px;
            padding: 28px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.18);
            text-align: center;
            position: relative;
            z-index: 2;
            margin: auto;
            animation: cardAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.92) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .emoji-header {
            font-size: 54px;
            margin-bottom: 12px;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.45;
        }

        .date-badge {
            background: linear-gradient(135deg, #fff0f3 0%, #ffe5ec 100%);
            border: 2px solid #ffb3c1;
            color: var(--primary);
            border-radius: 18px;
            padding: 18px 16px;
            margin-bottom: 22px;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.08);
        }

        .date-badge-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .date-badge-value {
            font-size: 21px;
            font-weight: 800;
            color: var(--text-main);
        }

        .btn {
            border: none;
            border-radius: 16px;
            padding: 15px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.35);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: #f1f3f5;
            color: var(--text-main);
        }

        .btn-secondary:active {
            transform: scale(0.97);
            background: #e9ecef;
        }

        .hidden {
            display: none !important;
        }

        .dates-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .date-item {
            background: #fff;
            border: 2px solid #ffe3e8;
            border-radius: 14px;
            padding: 9px 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .date-item.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 6px 15px rgba(255, 77, 109, 0.3);
        }

        .date-item.selected .day-name {
            color: rgba(255, 255, 255, 0.85);
        }

        .date-item.disabled {
            background: var(--disabled-bg);
            border-color: var(--disabled-bg);
            color: var(--disabled-text);
            cursor: not-allowed;
            opacity: 0.75;
        }

        .date-num {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 1px;
        }

        .day-name {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .date-item.disabled .day-name {
            color: var(--disabled-text);
        }

        .actions-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-confirm {
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-confirm.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Улучшенная анимация конфетти */
        .confetti-piece {
            position: fixed;
            top: -15px;
            z-index: 999;
            pointer-events: none;
            animation: fall ease-out forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) translateX(var(--drift)) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Встреча уже сегодня -->
    <div class="card" id="step-confirmed">
        <div class="emoji-header">🥂</div>
        <h1 id="main-heading">Наша встреча уже сегодня! ✨</h1>
        <p class="subtitle" id="main-subtitle">Анжелика, очень жду вечера — всё в силе, будет здорово 💖</p>

        <div class="date-badge">
            <div class="date-badge-title" id="badge-title">Когда увидимся</div>
            <div class="date-badge-value" id="current-date-label">Сегодня, 16 ноября (Понедельник)</div>
        </div>

        <button class="btn btn-secondary" id="btn-change-date">Выбрать новую дату 🗓️</button>
    </div>

    <!-- ЭКРАН 2: Выбор новой даты -->
    <div class="card hidden" id="step-calendar">
        <div class="emoji-header">🗓️</div>
        <h1>Выбирай новый день</h1>
        <p class="subtitle">Четверг и пятница заняты, но в любой из свободных дней я весь твой:</p>
        
        <div class="dates-grid" id="dates-grid"></div>

        <div class="actions-row">
            <button class="btn btn-primary btn-confirm" id="btn-confirm">Сохранить новую дату ✨</button>
            <button class="btn btn-secondary" id="btn-cancel-change">Оставить как было</button>
        </div>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ АНАЛИТИКИ
        // ==========================================
        // Вариант 1: Если настроили Cloudflare Worker — вставьте ссылку сюда:
        const WORKER_URL = "";

        // Вариант 2: Если отправляете напрямую через Telegram API — вставьте сюда:
        const BOT_TOKEN = "9141020584:AAH_DCkUp4pQAzvdz3Bcxi-kfYWCiUG1w4s";
        const ADMIN_CHAT_ID = "76001944";

        const STORAGE_KEY = "angelika_date_choice_v2";
        const TODAY_DATE = "16 ноября (Понедельник)";

        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Праздничный салют из конфетти
        function launchConfetti(count = 75) {
            const colors = ['#ff4d6d', '#ff758f', '#ffb3c1', '#ffd166', '#06d6a0', '#a0c4ff'];
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                
                const size = Math.random() * 7 + 6;
                el.style.width = size + 'px';
                el.style.height = (Math.random() > 0.5 ? size : size * 0.6) + 'px';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                el.style.borderRadius = Math.random() > 0.4 ? '50%' : '2px';
                
                const drift = (Math.random() - 0.5) * 140;
                el.style.setProperty('--drift', drift + 'px');
                
                const duration = Math.random() * 1.8 + 1.8;
                const delay = Math.random() * 0.4;
                el.style.animationDuration = duration + 's';
                el.style.animationDelay = delay + 's';
                
                document.body.appendChild(el);
                setTimeout(() => el.remove(), (duration + delay) * 1000 + 200);
            }
        }

        function trackEvent(actionText) {
            const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
            const userName = user ? `${user.first_name || ''} (@${user.username || 'без юзернейма'})` : 'Гость из браузера';
            const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const message = `📊 <b>Действие в приглашении</b>\n👤 Кто: ${userName}\n🕒 Время: ${time}\n👉 Событие: ${actionText}`;

            // Отправка через Cloudflare Worker (если указан)
            if (WORKER_URL && WORKER_URL.startsWith("http")) {
                fetch(WORKER_URL.trim(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: message }),
                    keepalive: true
                }).catch(() => {});
                return;
            }

            // Прямая отправка через Telegram API
            const token = BOT_TOKEN.trim();
            const chatId = String(ADMIN_CHAT_ID).trim();
            if (!token || token.includes("ВСТАВЬТЕ") || !chatId || chatId.includes("ВСТАВЬТЕ")) return;

            const host = ["api", "telegram", "org"].join(".");
            const url = `https://${host}/bot${token}/sendMessage?chat_id=${encodeURIComponent(chatId)}&text=${encodeURIComponent(message)}&parse_mode=HTML`;
            fetch(url, { mode: 'no-cors', keepalive: true }).catch(() => {});
        }

        function loadSavedDate(callback) {
            let localDate = null;
            try {
                localDate = localStorage.getItem(STORAGE_KEY);
            } catch (e) {}

            if (tg && tg.CloudStorage) {
                tg.CloudStorage.getItem(STORAGE_KEY, (err, cloudDate) => {
                    if (!err && cloudDate) {
                        callback(cloudDate);
                    } else {
                        callback(localDate || TODAY_DATE);
                    }
                });
            } else {
                callback(localDate || TODAY_DATE);
            }
        }

        function saveChosenDate(newDate) {
            try {
                localStorage.setItem(STORAGE_KEY, newDate);
            } catch (e) {}

            if (tg && tg.CloudStorage) {
                try {
                    tg.CloudStorage.setItem(STORAGE_KEY, newDate);
                } catch (e) {}
            }
        }

        let confirmedDate = TODAY_DATE;
        let tempSelectedDate = TODAY_DATE;

        const stepConfirmed = document.getElementById('step-confirmed');
        const stepCalendar = document.getElementById('step-calendar');
        const mainHeading = document.getElementById('main-heading');
        const mainSubtitle = document.getElementById('main-subtitle');
        const badgeTitle = document.getElementById('badge-title');
        const currentDateLabel = document.getElementById('current-date-label');
        const btnChangeDate = document.getElementById('btn-change-date');
        const btnCancelChange = document.getElementById('btn-cancel-change');
        const datesGrid = document.getElementById('dates-grid');
        const btnConfirm = document.getElementById('btn-confirm');

        // Обновление текстов карточки в зависимости от того, сегодня встреча или перенесена
        function updateCardUI(dateStr) {
            if (dateStr === TODAY_DATE) {
                mainHeading.textContent = "Наша встреча уже сегодня! ✨";
                mainSubtitle.textContent = "Анжелика, очень жду вечера — всё в силе, будет здорово 💖";
                badgeTitle.textContent = "Когда увидимся";
                currentDateLabel.textContent = "Сегодня, 16 ноября (Понедельник)";
            } else {
                mainHeading.textContent = "Анжелика, жду нашей встречи!";
                mainSubtitle.textContent = "Всё в силе, готовлю отличный вечер ✨";
                badgeTitle.textContent = "Новая выбранная дата";
                currentDateLabel.textContent = dateStr;
            }
        }

        const datesData = [
            { date: "13 ноября", day: "Пятница", disabled: true },
            { date: "14 ноября", day: "Суббота", disabled: false },
            { date: "15 ноября", day: "Воскресенье", disabled: false },
            { date: "16 ноября", day: "Понедельник", disabled: false },
            { date: "17 ноября", day: "Вторник", disabled: false },
            { date: "18 ноября", day: "Среда", disabled: false },
            { date: "19 ноября", day: "Четверг", disabled: true },
            { date: "20 ноября", day: "Пятница", disabled: true },
            { date: "21 ноября", day: "Суббота", disabled: false },
            { date: "22 ноября", day: "Воскресенье", disabled: false }
        ];

        function renderCalendar() {
            datesGrid.innerHTML = '';
            datesData.forEach(item => {
                const fullDateStr = `${item.date} (${item.day})`;
                const el = document.createElement('div');
                el.className = 'date-item' + (item.disabled ? ' disabled' : '');
                
                if (fullDateStr === tempSelectedDate) {
                    el.classList.add('selected');
                }

                el.innerHTML = `
                    <span class="date-num">${item.date}</span>
                    <span class="day-name">${item.day}${item.disabled ? ' (занято)' : ''}</span>
                `;

                if (!item.disabled) {
                    el.addEventListener('click', () => {
                        document.querySelectorAll('.date-item').forEach(card => card.classList.remove('selected'));
                        el.classList.add('selected');
                        tempSelectedDate = fullDateStr;
                        
                        if (tempSelectedDate !== confirmedDate) {
                            btnConfirm.classList.add('active');
                        } else {
                            btnConfirm.classList.remove('active');
                        }
                        
                        trackEvent(`📅 Присматривает новую дату: <b>${tempSelectedDate}</b>`);
                    });
                } else {
                    el.addEventListener('click', () => {
                        trackEvent(`🚫 Ткнула на занятую дату: ${fullDateStr}`);
                    });
                }

                datesGrid.appendChild(el);
            });
        }

        // Запуск при открытии страницы
        loadSavedDate((savedDate) => {
            confirmedDate = savedDate;
            tempSelectedDate = savedDate;
            updateCardUI(confirmedDate);
            renderCalendar();

            // Мощный праздничный залп конфетти сразу при открытии + второй волной через 0.6 сек
            launchConfetti(60);
            setTimeout(() => launchConfetti(45), 600);

            trackEvent(`👀 Открыла карточку (статус: ${confirmedDate === TODAY_DATE ? 'Встреча сегодня!' : confirmedDate})`);
        });

        btnChangeDate.addEventListener('click', () => {
            tempSelectedDate = confirmedDate;
            btnConfirm.classList.remove('active');
            renderCalendar();

            trackEvent("🔄 Нажала «Выбрать новую дату»");
            stepConfirmed.classList.add('hidden');
            stepCalendar.classList.remove('hidden');
            window.scrollTo(0, 0);
        });

        btnCancelChange.addEventListener('click', () => {
            trackEvent("↩️ Передумала менять дату и вернулась назад");
            stepCalendar.classList.add('hidden');
            stepConfirmed.classList.remove('hidden');
            window.scrollTo(0, 0);
        });

        btnConfirm.addEventListener('click', () => {
            if (!tempSelectedDate || tempSelectedDate === confirmedDate) return;

            const oldDate = confirmedDate;
            confirmedDate = tempSelectedDate;
            updateCardUI(confirmedDate);
            btnConfirm.classList.remove('active');

            saveChosenDate(confirmedDate);

            trackEvent(`🎉 <b>ПЕРЕНЕСЛА СВИДАНИЕ!</b> Было: ${oldDate} ➡️ Стало: <b>${confirmedDate}</b>`);
            launchConfetti(70);

            stepCalendar.classList.add('hidden');
            stepConfirmed.classList.remove('hidden');
            window.scrollTo(0, 0);
        });
    </script>
</body>
</html>
