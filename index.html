<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приглашение для Анжелики</title>
    <script src="https://telegram.org"></script>
    <script src="https://jsdelivr.net"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffe3e8 100%);
            --card-bg: rgba(255, 255, 255, 0.92);
            --primary: #ff4d6d;
            --primary-hover: #ff2a51;
            --text-main: #2b2d42;
            --text-muted: #8d99ae;
            --disabled-bg: #e9ecef;
            --disabled-text: #adb5bd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.15);
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
        }

        .emoji-header {
            font-size: 56px;
            margin-bottom: 16px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 12px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .buttons-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            min-height: 120px;
            align-items: center;
            justify-content: center;
        }

        .btn {
            border: none;
            border-radius: 16px;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            width: 100%;
            max-width: 240px;
        }

        .btn-yes {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.35);
            z-index: 2;
        }

        .btn-yes:active {
            transform: scale(0.96);
        }

        .btn-no {
            background: #f1f3f5;
            color: var(--text-muted);
            position: relative;
            z-index: 10;
            transition: left 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        top 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.2s;
        }

        .hidden {
            display: none !important;
        }

        .dates-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .date-item {
            background: #fff;
            border: 2px solid #ffe3e8;
            border-radius: 16px;
            padding: 12px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .date-item:not(.disabled):hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .date-item.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 6px 15px rgba(255, 77, 109, 0.3);
        }

        .date-item.selected .day-name {
            color: rgba(255, 255, 255, 0.85);
        }

        .date-item.disabled {
            background: var(--disabled-bg);
            border-color: var(--disabled-bg);
            color: var(--disabled-text);
            cursor: not-allowed;
            opacity: 0.75;
        }

        .date-num {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .day-name {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .date-item.disabled .day-name {
            color: var(--disabled-text);
        }

        .btn-confirm {
            background: var(--primary);
            color: white;
            width: 100%;
            max-width: 100%;
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-confirm.active {
            opacity: 1;
            pointer-events: auto;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.35);
        }
    </style>
</head>
<body>

    <!-- ШАГ 1: Вопрос -->
    <div class="card" id="step-1">
        <div class="emoji-header">💌</div>
        <h1>Анжелика, хочешь увидеться с Владом?</h1>
        <p class="subtitle">Обещаю отличный вечер, вкусную еду и хорошее настроение ✨</p>
        
        <div class="buttons-wrapper">
            <button class="btn btn-yes" id="btn-yes">Да, с радостью! 💖</button>
            <button class="btn btn-no" id="btn-no">Нет</button>
        </div>
    </div>

    <!-- ШАГ 2: Выбор даты -->
    <div class="card hidden" id="step-2">
        <div class="emoji-header">🗓️</div>
        <h1>Ура! Выбирай удобный день</h1>
        <p class="subtitle">Четверг и пятница заняты, но в любой из свободных дней я весь твой:</p>
        
        <div class="dates-grid" id="dates-grid"></div>

        <button class="btn btn-confirm" id="btn-confirm">Подтвердить дату ✨</button>
    </div>

    <!-- ШАГ 3: Финал -->
    <div class="card hidden" id="step-3">
        <div class="emoji-header">🥂</div>
        <h1>Договорились!</h1>
        <p class="subtitle" id="final-text"></p>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ АНАЛИТИКИ (ВСТАВЬТЕ СВОИ ДАННЫЕ)
        // ==========================================
        const BOT_TOKEN = "9141020584:AAH_DCkUp4pQAzvdz3Bcxi-kfYWCiUG1w4s";
        const ADMIN_CHAT_ID = "76001944";

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        function fireConfetti(options) {
            if (typeof confetti === 'function') {
                confetti(options);
            }
        }

        // Функция отправки логов вам в Telegram
        function trackEvent(actionText) {
            if (!BOT_TOKEN || BOT_TOKEN.includes("ВСТАВЬТЕ")) return;

            const user = tg?.initDataUnsafe?.user;
            const userName = user ? `${user.first_name || ''} (@${user.username || 'без юзернейма'})` : 'Гость из браузера';
            const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            const message = `📊 <b>Действие в приглашении</b>\n👤 Кто: ${userName}\n🕒 Время: ${time}\n👉 Событие: ${actionText}`;

            fetch(`https://telegram.org{BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: ADMIN_CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                }),
                keepalive: true
            }).catch(err => console.error('Ошибка аналитики:', err));
        }

        trackEvent("👀 Открыла приглашение!");

        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const step3 = document.getElementById('step-3');
        const datesGrid = document.getElementById('dates-grid');
        const btnConfirm = document.getElementById('btn-confirm');
        const finalText = document.getElementById('final-text');

        let dodgeCount = 0;
        let lastNoLogTime = 0;
        const phrases = [
            "Нет",
            "Точно нет? 🥺",
            "Подумай еще!",
            "Не поймаешь 😜",
            "Кнопка сломалась",
            "Жми «Да»! ❤️"
        ];

        function moveNoButton(e) {
            if (e) e.preventDefault();
            
            dodgeCount++;
            btnNo.textContent = phrases[dodgeCount % phrases.length];

            const now = Date.now();
            if (dodgeCount === 1 || now - lastNoLogTime > 1500) {
                trackEvent(`🏃‍♀️ Попыталась нажать «Нет» (попытка №${dodgeCount})`);
                lastNoLogTime = now;
            }

            btnNo.style.position = 'fixed';
            const padding = 20;
            const maxX = window.innerWidth - btnNo.offsetWidth - padding;
            const maxY = window.innerHeight - btnNo.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';

            const scale = Math.min(1 + dodgeCount * 0.05, 1.35);
            btnYes.style.transform = `scale(${scale})`;
        }

        btnNo.addEventListener('mouseover', moveNoButton);
        btnNo.addEventListener('touchstart', moveNoButton, { passive: false });
        btnNo.addEventListener('click', moveNoButton);

        // Нажатие кнопки "Да"
        btnYes.addEventListener('click', () => {
            trackEvent(`💖 Нажала «Да, с радостью!» (перед этим пыталась нажать «Нет»: ${dodgeCount} раз)`);
            
            btnNo.style.display = 'none';
            fireConfetti({
                particleCount: 60,
                spread: 70,
                origin: { y: 0.6 }
            });
            step1.classList.add('hidden');
            step2.classList.remove('hidden');
        });

        // Календарь на 13-22 ноября 2026
        const datesData = [
            { date: "13 ноября", day: "Пятница", disabled: true },
            { date: "14 ноября", day: "Суббота", disabled: false },
            { date: "15 ноября", day: "Воскресенье", disabled: false },
            { date: "16 ноября", day: "Понедельник", disabled: false },
            { date: "17 ноября", day: "Вторник", disabled: false },
            { date: "18 ноября", day: "Среда", disabled: false },
            { date: "19 ноября", day: "Четверг", disabled: true },
            { date: "20 ноября", day: "Пятница", disabled: true },
            { date: "21 ноября", day: "Суббота", disabled: false },
            { date: "22 ноября", day: "Воскресенье", disabled: false }
        ];

        let selectedDate = null;

        datesData.forEach(item => {
            const el = document.createElement('div');
            el.className = 'date-item' + (item.disabled ? ' disabled' : '');
            el.innerHTML = `
                <span class="date-num">${item.date}</span>
                <span class="day-name">${item.day}${item.disabled ? ' (занято)' : ''}</span>
            `;

            if (!item.disabled) {
                el.addEventListener('click', () => {
                    document.querySelectorAll('.date-item').forEach(card => card.classList.remove('selected'));
                    el.classList.add('selected');
                    selectedDate = `${item.date} (${item.day})`;
                    btnConfirm.classList.add('active');
                    
                    trackEvent(`📅 Выбрала в календаре: <b>${selectedDate}</b> (пока без подтверждения)`);
                });
            } else {
                el.addEventListener('click', () => {
                    trackEvent(`🚫 Ткнула на занятую дату: ${item.date} (${item.day})`);
                });
            }

            datesGrid.appendChild(el);
        });

        // Финальное подтверждение
        btnConfirm.addEventListener('click', () => {
            if (!selectedDate) return;

            trackEvent(`🎉 <b>ПОДТВЕРДИЛА СВИДАНИЕ!</b> Итоговая дата: <b>${selectedDate}</b>`);

            fireConfetti({
                particleCount: 100,
                spread: 80,
                origin: { y: 0.6 }
            });

            const payload = JSON.stringify({
                answer: "Да",
                date: selectedDate,
                noAttempts: dodgeCount
            });

            if (tg?.initDataUnsafe?.user) {
                tg.sendData(payload);
            }

            step2.classList.add('hidden');
            step3.classList.remove('hidden');
            finalText.innerHTML = `Жду нашей встречи <b>${selectedDate}</b>! Влад уже получил твой ответ ❤️`;
        });
    </script>
</body>
</html>
