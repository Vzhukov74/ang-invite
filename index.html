<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Наше свидание — 16 ноября</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffe3e8 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary: #ff4d6d;
            --text-main: #2b2d42;
            --text-muted: #8d99ae;
            --disabled-bg: #e9ecef;
            --disabled-text: #adb5bd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 26px;
            padding: 28px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.15);
            text-align: center;
            position: relative;
            z-index: 2;
            margin: auto;
        }

        .emoji-header {
            font-size: 50px;
            margin-bottom: 12px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 21px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.45;
        }

        .date-badge {
            background: #fff0f3;
            border: 2px solid #ffccd5;
            color: var(--primary);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 22px;
        }

        .date-badge-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .date-badge-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .btn {
            border: none;
            border-radius: 16px;
            padding: 15px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.35);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: #f1f3f5;
            color: var(--text-main);
        }

        .btn-secondary:active {
            transform: scale(0.97);
            background: #e9ecef;
        }

        .hidden {
            display: none !important;
        }

        .dates-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .date-item {
            background: #fff;
            border: 2px solid #ffe3e8;
            border-radius: 14px;
            padding: 9px 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .date-item.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 6px 15px rgba(255, 77, 109, 0.3);
        }

        .date-item.selected .day-name {
            color: rgba(255, 255, 255, 0.85);
        }

        .date-item.disabled {
            background: var(--disabled-bg);
            border-color: var(--disabled-bg);
            color: var(--disabled-text);
            cursor: not-allowed;
            opacity: 0.75;
        }

        .date-num {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 1px;
        }

        .day-name {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .date-item.disabled .day-name {
            color: var(--disabled-text);
        }

        .actions-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-confirm {
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-confirm.active {
            opacity: 1;
            pointer-events: auto;
        }

        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            z-index: 999;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Подтвержденная встреча -->
    <div class="card" id="step-confirmed">
        <div class="emoji-header">🥂</div>
        <h1>Анджелика, жду нашей встречи!</h1>
        <p class="subtitle">Всё в силе, готовлю отличный вечер ✨</p>

        <div class="date-badge">
            <div class="date-badge-title">Выбранная дата</div>
            <div class="date-badge-value" id="current-date-label">16 ноября (Понедельник)</div>
        </div>

        <button class="btn btn-secondary" id="btn-change-date">Выбрать новую дату 🗓️</button>
    </div>

    <!-- ЭКРАН 2: Выбор новой даты -->
    <div class="card hidden" id="step-calendar">
        <div class="emoji-header">🗓️</div>
        <h1>Выбирай новый день</h1>
        <p class="subtitle">Четверг и пятница заняты, но в любой из свободных дней я весь твой:</p>
        
        <div class="dates-grid" id="dates-grid"></div>

        <div class="actions-row">
            <button class="btn btn-primary btn-confirm" id="btn-confirm">Сохранить новую дату ✨</button>
            <button class="btn btn-secondary" id="btn-cancel-change">Оставить как было</button>
        </div>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ АНАЛИТИКИ (ВСТАВЬТЕ СВОИ ДАННЫЕ)
        // ==========================================
        const BOT_TOKEN = "9141020584:AAH_DCkUp4pQAzvdz3Bcxi-kfYWCiUG1w4s";
        const ADMIN_CHAT_ID = "76001944";

        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        function launchConfetti(count = 40) {
            const colors = ['#ff4d6d', '#ff758f', '#ffb3c1', '#ffd166', '#06d6a0'];
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                el.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 3000);
            }
        }

        function trackEvent(actionText) {
            const token = BOT_TOKEN.trim();
            const chatId = String(ADMIN_CHAT_ID).trim();
            if (!token || token.includes("ВСТАВЬТЕ") || !chatId || chatId.includes("ВСТАВЬТЕ")) return;

            const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
            const userName = user ? `${user.first_name || ''} (@${user.username || 'без юзернейма'})` : 'Гость из браузера';
            const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            const message = `📊 <b>Действие в приглашении</b>\n👤 Кто: ${userName}\n🕒 Время: ${time}\n👉 Событие: ${actionText}`;
            
            const host = ["api", "telegram", "org"].join(".");
            const url = `https://${host}/bot${token}/sendMessage?chat_id=${encodeURIComponent(chatId)}&text=${encodeURIComponent(message)}&parse_mode=HTML`;

            fetch(url, { mode: 'no-cors', keepalive: true }).catch(() => {});
        }

        // Текущая зафиксированная дата
        let confirmedDate = "16 ноября (Понедельник)";
        let tempSelectedDate = confirmedDate;

        const stepConfirmed = document.getElementById('step-confirmed');
        const stepCalendar = document.getElementById('step-calendar');
        const currentDateLabel = document.getElementById('current-date-label');
        const btnChangeDate = document.getElementById('btn-change-date');
        const btnCancelChange = document.getElementById('btn-cancel-change');
        const datesGrid = document.getElementById('dates-grid');
        const btnConfirm = document.getElementById('btn-confirm');

        // При открытии страницы запускаем конфетти и логируем просмотр
        launchConfetti(35);
        trackEvent(`👀 Открыла карточку свидания (текущая дата: ${confirmedDate})`);

        // Переход к выбору новой даты
        btnChangeDate.addEventListener('click', () => {
            trackEvent("🔄 Нажала «Выбрать новую дату»");
            stepConfirmed.classList.add('hidden');
            stepCalendar.classList.remove('hidden');
            window.scrollTo(0, 0);
        });

        // Возврат назад без изменений
        btnCancelChange.addEventListener('click', () => {
            trackEvent("↩️ Передумала менять дату и вернулась назад");
            stepCalendar.classList.add('hidden');
            stepConfirmed.classList.remove('hidden');
            window.scrollTo(0, 0);
        });

        // Календарь на 13-22 ноября 2026
        const datesData = [
            { date: "13 ноября", day: "Пятница", disabled: true },
            { date: "14 ноября", day: "Суббота", disabled: true },
            { date: "15 ноября", day: "Воскресенье", disabled: false },
            { date: "16 ноября", day: "Понедельник", disabled: false },
            { date: "17 ноября", day: "Вторник", disabled: false },
            { date: "18 ноября", day: "Среда", disabled: false },
            { date: "19 ноября", day: "Четверг", disabled: false },
            { date: "20 ноября", day: "Пятница", disabled: false },
            { date: "21 ноября", day: "Суббота", disabled: false },
            { date: "22 ноября", day: "Воскресенье", disabled: false }
        ];

        datesData.forEach(item => {
            const fullDateStr = `${item.date} (${item.day})`;
            const el = document.createElement('div');
            el.className = 'date-item' + (item.disabled ? ' disabled' : '');
            
            // Подсвечиваем текущую выбранную дату в списке
            if (fullDateStr === confirmedDate) {
                el.classList.add('selected');
            }

            el.innerHTML = `
                <span class="date-num">${item.date}</span>
                <span class="day-name">${item.day}${item.disabled ? ' (занято)' : ''}</span>
            `;

            if (!item.disabled) {
                el.addEventListener('click', () => {
                    document.querySelectorAll('.date-item').forEach(card => card.classList.remove('selected'));
                    el.classList.add('selected');
                    tempSelectedDate = fullDateStr;
                    
                    // Активируем кнопку сохранения, только если выбрана дата, отличная от текущей
                    if (tempSelectedDate !== confirmedDate) {
                        btnConfirm.classList.add('active');
                    } else {
                        btnConfirm.classList.remove('active');
                    }
                    
                    trackEvent(`📅 Присматривает новую дату: <b>${tempSelectedDate}</b>`);
                });
            } else {
                el.addEventListener('click', () => {
                    trackEvent(`🚫 Ткнула на занятую дату: ${fullDateStr}`);
                });
            }

            datesGrid.appendChild(el);
        });

        // Сохранение новой даты
        btnConfirm.addEventListener('click', () => {
            if (!tempSelectedDate || tempSelectedDate === confirmedDate) return;

            const oldDate = confirmedDate;
            confirmedDate = tempSelectedDate;
            currentDateLabel.textContent = confirmedDate;
            btnConfirm.classList.remove('active');

            trackEvent(`🎉 <b>ПЕРЕНЕСЛА СВИДАНИЕ!</b> Было: ${oldDate} ➡️ Стало: <b>${confirmedDate}</b>`);
            launchConfetti(65);

            stepCalendar.classList.add('hidden');
            stepConfirmed.classList.remove('hidden');
            window.scrollTo(0, 0);
        });
    </script>
</body>
</html>
